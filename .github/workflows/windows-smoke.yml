name: Windows smoke test

# Builds the Windows installer and exercises the installed app end to end on a real
# Windows runner (see desktop/scripts/smoke-windows.ps1). Never publishes anything.
on:
  workflow_dispatch: {}
  push:
    branches: [windows-support]
  pull_request:
    branches: [main]
    paths: ["desktop/**", "npm/**", "src/**", "dashboard/**", ".github/workflows/windows-smoke.yml"]
  schedule:
    - cron: "17 3 * * 1" # weekly, so a Windows runner or dependency change shows up without a push

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Build installer and smoke test
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # only to publish the UI screenshots to the windows-screenshots branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install LoopPrism and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer (sidecar + electron-builder)
        working-directory: desktop
        run: npm run dist

      - name: Keep the installer for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: LoopPrism-windows-x64-test-build
          path: desktop/release/*.exe
          retention-days: 7
          if-no-files-found: error

      - name: Smoke test the installed app
        run: ./desktop/scripts/smoke-windows.ps1 -WithClaude

      # Artifacts need a login to download; a branch of PNGs can be viewed by anyone.
      - name: Publish UI screenshots
        # By hand, or on this branch while the Windows UI is being worked on; not on routine PR runs.
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/windows-support')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ls smoke-logs/screenshots/*.png >/dev/null 2>&1; then
            mkdir /tmp/shots && cp smoke-logs/screenshots/*.png /tmp/shots/
            cd /tmp/shots
            git init -q -b windows-screenshots
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add .
            git commit -qm "Windows UI screenshots for ${GITHUB_SHA}"
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push -f origin windows-screenshots
          else
            echo "no screenshots were taken"
          fi

      - name: Keep the smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-logs
          path: smoke-logs/
          if-no-files-found: ignore
