name: Release Windows preview

# Push a tag like `desktop-win-v0.3.0-windows.1` (it must match desktop/package.json's version)
# to build the Windows installer, smoke test it on a real Windows runner, and publish it as a
# GitHub *pre-release*. The tag is deliberately not `desktop-v*`: the macOS app's updater and
# release workflow ignore it, so this never reaches macOS users.
on:
  push:
    tags:
      - "desktop-win-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "desktop-win-v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match desktop/package.json version ${version}"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install LoopPrism and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer (sidecar + electron-builder)
        working-directory: desktop
        run: npm run dist

      # Nothing is published unless the installer installs, starts, serves, and updates itself.
      - name: Smoke test the installed app
        run: ./desktop/scripts/smoke-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: LoopPrism-windows-x64
          path: desktop/release/*.exe
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "LoopPrism for Windows ${TAG#desktop-win-v} (preview)" \
            --notes "Windows x64 preview, built from the \`windows-support\` branch. Run the \`.exe\`; it installs for your user without administrator rights. It is not code-signed, so SmartScreen may warn: choose **More info → Run anyway**. The installer was installed, launched, used and updated on a real Windows runner before this release was created. Not yet covered: ARM64 Windows, and Claude Code/Codex running inside WSL. Previews do not auto-update; install the next release by hand."
